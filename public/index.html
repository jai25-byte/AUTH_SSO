<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · VaultAuth SSO</title>
  <meta name="description" content="Sign in to VaultAuth SSO, your unified identity and access management platform." />

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Compiled Tailwind CSS v4 -->
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="root"></div>

  <!-- React Bundle -->
  <script type="module" src="/bundle.js"></script>

  <!-- Live Reload Script for Dev -->
  <script>
    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
      try {
        const evtSource = new EventSource("/__dev_events");
        evtSource.onmessage = (event) => {
          if (event.data === "reload") {
            window.location.reload();
          }
        };
      } catch (e) {}
    }
  </script>
</body>
</html>
