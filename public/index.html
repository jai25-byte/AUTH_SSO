<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VaultAuth SSO — Unified Identity & Access Management</title>
  <meta name="description" content="VaultAuth Enterprise SSO, IAM Dashboard & Control Center" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    /* Instant reset before external CSS loads */
    html, body, #root {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      width: 100%;
      background: #0b1220;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/bundle.js"></script>
  <script>
    // Live Reload EventSource for Bun dev server
    if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
      try {
        const devEvts = new EventSource("/__dev_events");
        devEvts.onmessage = (ev) => {
          if (ev.data === "reload") window.location.reload();
        };
      } catch {}
    }
  </script>
</body>
</html>
