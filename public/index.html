<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSO Authentication Portal</title>
  
  <!-- Favicon / Meta -->
  <meta name="description" content="Modern SSO Authentication Portal built with React, Bun, and Tailwind CSS" />
  
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  
  <!-- Compiled Tailwind CSS v4 -->
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="min-h-screen overflow-x-hidden antialiased font-['Poppins']">
  <div id="root"></div>
  
  <!-- React Bundle -->
  <script type="module" src="/bundle.js"></script>

  <!-- Live Reload Script for Dev -->
  <script>
    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
      try {
        const evtSource = new EventSource("/__dev_events");
        evtSource.onmessage = (event) => {
          if (event.data === "reload") {
            window.location.reload();
          }
        };
      } catch (e) {
        // Dev server not providing SSE, ignore
      }
    }
  </script>
</body>
</html>
